openapi: 3.1.0
info:
  title: Discovery Trend Descriptor V2 Contract
  version: 2.0.0
  description: >
    Versioned trend contract for spec 050. Adds explicit canonical `flat`,
    numeric confidence fields, first-class OLS diagnostic outputs, and
    descriptor-state semantics for cadence-rejection unavailability.

paths:
  /api/datasets:
    get:
      summary: Get dataset catalog with canonical trend descriptor v2
      responses:
        "200":
          description: Dataset catalog response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetCatalogResponse"

  /api/datasets/search:
    get:
      summary: Search datasets with canonical trend descriptor v2
      responses:
        "200":
          description: Dataset search response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSearchResponse"

  /api/datasets/recent:
    get:
      summary: Get recent dataset updates with canonical trend descriptor v2
      responses:
        "200":
          description: Recent updates response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRecentUpdatesResponse"

  /api/datasets/{datasetId}:
    get:
      summary: Get dataset detail with canonical trend descriptor and lookback evidence
      parameters:
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetailResponse"

  /api/datasets/{datasetId}/observations/as-of:
    get:
      summary: Get observation as-of trend evidence with v2 canonical semantics
      parameters:
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Observation as-of response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationAsOfResponse"

components:
  schemas:
    SourceRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    OlsDiagnostics:
      type: object
      properties:
        slope:
          type: number
          nullable: true
        intercept:
          type: number
          nullable: true
        r_squared:
          type: number
          nullable: true
        p_value:
          type: number
          nullable: true

    PreprocessingMetadata:
      type: object
      required: [smoothing_method, seasonal_adjustment_method, preprocess_version]
      properties:
        smoothing_method:
          type: string
          enum: [ewma, none]
        smoothing_parameters:
          type: object
          additionalProperties: true
        seasonal_adjustment_method:
          type: string
          enum: [stl, mstl, none]
        seasonal_periods:
          type: array
          items:
            type: integer
        seasonal_reliability_state:
          type: string
          enum: [reliable, fallback_non_adjusted, not_applicable]
        preprocess_version:
          type: string

    CanonicalTrendDescriptorV2:
      type: object
      required:
        - descriptor_version
        - descriptor_state
      properties:
        descriptor_version:
          type: string
          enum: [v2]
        descriptor_state:
          type: string
          enum: [available, unavailable]
        trend_label:
          type: string
          nullable: true
        direction:
          type: string
          enum: [up, down, flat]
          nullable: true
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        selected_lookback_points:
          type: integer
          nullable: true
        observed_on:
          type: string
          format: date
          nullable: true
        dominant_measure_family:
          type: string
          enum: [theil_sen, mixed, none]
        reason_code:
          type: string
          nullable: true
      allOf:
        - if:
            properties:
              descriptor_state:
                const: unavailable
          then:
            properties:
              direction:
                type: "null"
              confidence_score:
                type: "null"

    LookbackTrendEvidenceV2:
      type: object
      required:
        - lookback_points
        - applicability_state
        - descriptor_state
      properties:
        lookback_points:
          type: integer
          enum: [1, 2, 3, 4, 5, 10, 25, 50, 100, 250, 500, 1000]
        applicability_state:
          type: string
          enum: [applicable, inapplicable]
        descriptor_state:
          type: string
          enum: [available, unavailable]
        trend_label:
          type: string
          nullable: true
        direction:
          type: string
          enum: [up, down, flat]
          nullable: true
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        dominant_measure_family:
          type: string
          enum: [theil_sen, mixed, none]
          nullable: true
        theil_sen_slope:
          type: number
          nullable: true
        theil_sen_low_slope:
          type: number
          nullable: true
        theil_sen_high_slope:
          type: number
          nullable: true
        kendall_tau:
          type: number
          nullable: true
        kendall_p_value:
          type: number
          nullable: true
        preprocessing:
          $ref: "#/components/schemas/PreprocessingMetadata"
        ols_diagnostics:
          $ref: "#/components/schemas/OlsDiagnostics"
        reason_code:
          type: string
          nullable: true

    DatasetSummary:
      type: object
      required:
        - dataset_id
        - source
        - title
        - topic_tags
        - canonical_trend_descriptor
      properties:
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        description:
          type: string
          nullable: true
        geographic_scope:
          type: string
          nullable: true
        topic_tags:
          type: array
          items:
            type: string
        latest_update_at:
          type: string
          format: date-time
          nullable: true
        canonical_trend_descriptor:
          $ref: "#/components/schemas/CanonicalTrendDescriptorV2"

    DatasetSearchResponse:
      type: object
      required: [items, page, page_size, total_items, total_pages, sort]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        sort:
          type: string

    DatasetCatalogResponse:
      type: object
      required: [items, page, page_size, total_items, total_pages, sort]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
        aggregations:
          type: object
          additionalProperties: true
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        sort:
          type: string

    DatasetRecentActionLinks:
      type: object
      required: [view_table_href, download_csv_href]
      properties:
        view_table_href:
          type: string
        download_csv_href:
          type: string

    DatasetRecentItem:
      allOf:
        - $ref: "#/components/schemas/DatasetSummary"
        - type: object
          required: [item_type, action_links]
          properties:
            item_type:
              type: string
              enum: [dataset_update]
            action_links:
              $ref: "#/components/schemas/DatasetRecentActionLinks"

    DatasetRecentUpdatesResponse:
      type: object
      required: [items, limit, sort]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRecentItem"
        limit:
          type: integer
        sort:
          type: string

    ObservationPoint:
      type: object
      required: [observed_on, value, reported_at, attributes]
      properties:
        observed_on:
          type: string
          format: date
        value:
          type: number
        reported_at:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: true

    DatasetDetailResponse:
      type: object
      required:
        - dataset_id
        - source
        - title
        - metadata
        - observations
        - observation_sort
        - canonical_trend_descriptor
      properties:
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        description:
          type: string
          nullable: true
        geographic_scope:
          type: string
          nullable: true
        topic_tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationPoint"
        canonical_trend_descriptor:
          $ref: "#/components/schemas/CanonicalTrendDescriptorV2"
        lookback_trend_evidence:
          type: array
          items:
            $ref: "#/components/schemas/LookbackTrendEvidenceV2"
        observation_sort:
          type: string

    ObservationAsOfResponse:
      type: object
      required:
        - dataset_id
        - as_of_observed_on
        - canonical_trend_descriptor
        - lookback_trend_evidence
      properties:
        dataset_id:
          type: string
        as_of_observed_on:
          type: string
          format: date
        canonical_trend_descriptor:
          $ref: "#/components/schemas/CanonicalTrendDescriptorV2"
        lookback_trend_evidence:
          type: array
          items:
            $ref: "#/components/schemas/LookbackTrendEvidenceV2"
