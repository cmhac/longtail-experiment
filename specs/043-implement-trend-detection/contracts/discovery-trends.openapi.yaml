openapi: 3.0.3
info:
  title: Discovery API Trend Contract Additions
  version: 0.1.0
  description: |
    Contract additions for unified trend feed items and dataset detail trend
    visualization payloads on existing discovery endpoints.
paths:
  /api/datasets/recent:
    get:
      summary: Get unified recent updates including trend events
      responses:
        "200":
          description: Unified recent update items
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, sort]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/DatasetUpdateItem"
                        - $ref: "#/components/schemas/TrendFeedItem"
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 5
                  sort:
                    type: string
  /api/datasets/{datasetId}:
    get:
      summary: Get dataset detail including trend visualization spans
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetailResponse"
        "400":
          description: Trend span payload invalid/malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendPayloadErrorResponse"
components:
  schemas:
    SourceRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    DatasetRecentActionLinks:
      type: object
      required: [view_table_href, download_csv_href]
      properties:
        view_table_href:
          type: string
        download_csv_href:
          type: string

    DatasetUpdateItem:
      type: object
      required:
        [item_type, dataset_id, source, title, latest_update_at, action_links]
      properties:
        item_type:
          type: string
          enum: [dataset_update]
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        description:
          type: string
          nullable: true
        geographic_scope:
          type: string
          nullable: true
        topic_tags:
          type: array
          items:
            type: string
        latest_update_at:
          type: string
          format: date-time
        action_links:
          $ref: "#/components/schemas/DatasetRecentActionLinks"

    TrendFeedItem:
      type: object
      required:
        - item_type
        - dataset_id
        - source
        - title
        - direction
        - strength
        - start_period
        - latest_update_at
        - action_links
      properties:
        item_type:
          type: string
          enum: [trend_event]
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        direction:
          type: string
          enum: [up, down]
        strength:
          type: string
        start_period:
          type: string
          format: date
        latest_update_at:
          type: string
          format: date
        action_links:
          $ref: "#/components/schemas/DatasetRecentActionLinks"

    DatasetDetailResponse:
      type: object
      required:
        - dataset_id
        - source
        - title
        - metadata
        - observations
        - trend_spans
        - observation_sort
      properties:
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        description:
          type: string
          nullable: true
        geographic_scope:
          type: string
          nullable: true
        topic_tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        observations:
          type: array
          items:
            type: object
            required: [observed_on, value, reported_at, attributes]
            properties:
              observed_on:
                type: string
                format: date
              value:
                type: number
              reported_at:
                type: string
                format: date-time
              attributes:
                type: object
                additionalProperties: true
        trend_spans:
          type: array
          description: Non-overlapping display regions.
          items:
            $ref: "#/components/schemas/TrendVisualizationSpan"
        observation_sort:
          type: string

    TrendVisualizationSpan:
      type: object
      required:
        - start_period
        - end_period
        - direction
        - trend_label
        - tooltip
      properties:
        start_period:
          type: string
          format: date
        end_period:
          type: string
          format: date
        direction:
          type: string
          enum: [up, down]
        trend_label:
          type: string
        tooltip:
          $ref: "#/components/schemas/TrendTooltipPayload"

    TrendTooltipPayload:
      type: object
      required: [headline, detail]
      properties:
        headline:
          type: string
        detail:
          type: string

    TrendPayloadErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          enum: [dataset_detail_trend_payload_invalid]
        message:
          type: string
