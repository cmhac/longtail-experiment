openapi: 3.1.0
info:
  title: Discovery Lookback Trend Contract
  version: 0.2.1
  description: >
    Contract additions for current-state multi-lookback trend snapshots and
    API-provided canonical trend descriptor rendering on dataset list and
    dataset detail surfaces, including shared row-level and detail-heading
    trend-indicator support.
paths:
  /api/datasets:
    get:
      summary: Get dataset catalog with canonical current-trend summaries
      responses:
        "200":
          description: Dataset catalog response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetCatalogResponse"

  /api/datasets/search:
    get:
      summary: Search datasets with canonical current-trend summaries
      responses:
        "200":
          description: Dataset search response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetSearchResponse"

  /api/datasets/recent:
    get:
      summary: Get recent dataset updates with canonical current-trend summaries
      responses:
        "200":
          description: Recent updates response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRecentUpdatesResponse"

  /api/datasets/{datasetId}:
    get:
      summary: Get dataset detail with canonical trend descriptor
      parameters:
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset detail response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetailResponse"

components:
  schemas:
    CanonicalTrendDescriptor:
      type: object
      required:
        - descriptor_state
      properties:
        descriptor_state:
          type: string
          enum: [available, unavailable]
        trend_label:
          type: string
          nullable: true
        direction:
          type: string
          enum: [up, down]
          nullable: true
        strength:
          type: string
          nullable: true
        selected_lookback_points:
          type: integer
          nullable: true
        observed_on:
          type: string
          format: date
          nullable: true
        reason_code:
          type: string
          nullable: true

    LookbackTrendSnapshot:
      type: object
      required:
        - lookback_points
        - applicability_state
      properties:
        lookback_points:
          type: integer
          enum: [1, 2, 3, 4, 5, 10, 25, 50, 100, 250, 500, 1000]
        applicability_state:
          type: string
          enum: [applicable, inapplicable]
        outcome_state:
          type: string
          enum: [significant_trend, no_significant_trend]
          nullable: true
        trend_label:
          type: string
          nullable: true
        direction:
          type: string
          enum: [up, down]
          nullable: true
        strength:
          type: string
          nullable: true
        reason_code:
          type: string
          nullable: true

    SourceRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    DatasetSummary:
      type: object
      required:
        - dataset_id
        - source
        - title
        - topic_tags
        - canonical_trend_descriptor
      properties:
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        description:
          type: string
          nullable: true
        geographic_scope:
          type: string
          nullable: true
        topic_tags:
          type: array
          items:
            type: string
        latest_update_at:
          type: string
          format: date-time
          nullable: true
        canonical_trend_descriptor:
          $ref: "#/components/schemas/CanonicalTrendDescriptor"

    DatasetSearchResponse:
      type: object
      required: [items, page, page_size, total_items, total_pages, sort]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        sort:
          type: string

    DatasetCatalogResponse:
      type: object
      required: [items, page, page_size, total_items, total_pages, sort]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
        aggregations:
          type: object
          additionalProperties: true
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        sort:
          type: string

    DatasetRecentActionLinks:
      type: object
      required: [view_table_href, download_csv_href]
      properties:
        view_table_href:
          type: string
        download_csv_href:
          type: string

    DatasetRecentItem:
      allOf:
        - $ref: "#/components/schemas/DatasetSummary"
        - type: object
          required: [item_type, action_links]
          properties:
            item_type:
              type: string
              enum: [dataset_update]
            action_links:
              $ref: "#/components/schemas/DatasetRecentActionLinks"

    TrendRecentItem:
      type: object
      required:
        - item_type
        - dataset_id
        - source
        - title
        - direction
        - strength
        - start_period
        - latest_update_at
        - action_links
      properties:
        item_type:
          type: string
          enum: [trend_event]
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        direction:
          type: string
          enum: [up, down]
        strength:
          type: string
        start_period:
          type: string
        latest_update_at:
          type: string
        action_links:
          $ref: "#/components/schemas/DatasetRecentActionLinks"

    DatasetRecentUpdatesResponse:
      type: object
      required: [items, limit, sort]
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/DatasetRecentItem"
              - $ref: "#/components/schemas/TrendRecentItem"
        limit:
          type: integer
        sort:
          type: string

    ObservationPoint:
      type: object
      required: [observed_on, value, reported_at, attributes]
      properties:
        observed_on:
          type: string
          format: date
        value:
          type: number
        reported_at:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: true

    DatasetDetailResponse:
      type: object
      required:
        - dataset_id
        - source
        - title
        - metadata
        - observations
        - observation_sort
        - canonical_trend_descriptor
      properties:
        dataset_id:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        title:
          type: string
        description:
          type: string
          nullable: true
        geographic_scope:
          type: string
          nullable: true
        topic_tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationPoint"
        canonical_trend_descriptor:
          $ref: "#/components/schemas/CanonicalTrendDescriptor"
        lookback_trend_snapshots:
          type: array
          items:
            $ref: "#/components/schemas/LookbackTrendSnapshot"
        observation_sort:
          type: string
