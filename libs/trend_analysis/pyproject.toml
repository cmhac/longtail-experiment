[project]
name = "longtail-trend-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.7.0", "ty>=0.0.1a16"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "D",
    "A",
    "C4",
    "UP",
    "SIM",
    "RET",
    "PTH",
    "DTZ",
    "PL",
]
ignore = ["D212", "D203"]

[tool.pytest.ini_options]
addopts = "-q --maxfail=1 --cov=libs/trend_analysis/src --cov-report=term-missing --cov-fail-under=90"
testpaths = ["libs/trend_analysis/tests"]

[tool.ty]
python-version = "3.12"
