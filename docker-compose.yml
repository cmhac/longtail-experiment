services:
  pipeline:
    image: python:3.12-alpine
    command: ["sh", "-c", "python -m http.server 8090"]
    working_dir: /workspace
    ports:
      - "8090:8090"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    image: python:3.12-alpine
    command: ["sh", "-c", "python -m http.server 8080"]
    working_dir: /workspace
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    image: node:22-alpine
    command:
      [
        "sh",
        "-c",
        'node -e "require(''http'').createServer((_,res)=>res.end(''ok'')).listen(3000)"',
      ]
    working_dir: /workspace
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
