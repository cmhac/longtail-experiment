services:
  db:
    image: postgres:16-alpine
    env_file:
      - docker/compose/stack.env
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-longtail_local}
      POSTGRES_USER: ${LOCAL_DB_USER:-longtail}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-longtail}
    ports:
      - "${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - local_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOCAL_DB_USER:-longtail} -d ${LOCAL_DB_NAME:-longtail_local}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  dagster_db:
    image: postgres:16-alpine
    env_file:
      - docker/compose/stack.env
      - docker/compose/local.secrets.env
    environment:
      POSTGRES_DB: ${DAGSTER_METADATA_DB_NAME:-dagster_local}
      POSTGRES_USER: ${DAGSTER_METADATA_DB_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_METADATA_DB_PASSWORD:-longtail}
    ports:
      - "${DAGSTER_METADATA_DB_PORT:-55433}:5432"
    volumes:
      - dagster_metadata_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DAGSTER_METADATA_DB_USER:-dagster} -d ${DAGSTER_METADATA_DB_NAME:-dagster_local}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  pipeline:
    image: python:3.12-alpine
    command: ["sh", "-c", "python -m http.server 8090"]
    working_dir: /workspace
    ports:
      - "8090:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8090'', timeout=2)" || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    env_file:
      - docker/compose/stack.env
    environment:
      UV_HTTP_TIMEOUT: "180"
      UV_HTTP_RETRIES: "5"
      PYTHONPATH: /workspace/apps/backend
      LOCAL_DB_HOST: db
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-longtail_local}
      LOCAL_DB_USER: ${LOCAL_DB_USER:-longtail}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-longtail}
      DATABASE_URL: postgresql+psycopg://${LOCAL_DB_USER:-longtail}:${LOCAL_DB_PASSWORD:-longtail}@db:5432/${LOCAL_DB_NAME:-longtail_local}
      DISCOVERY_EXPECTED_DB_REVISION: 0012_lookback_trend_snapshots
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "if [ ! -x apps/backend/.venv/bin/alembic ]; then uv sync --project apps/backend --frozen; fi && uv run --project apps/backend --no-sync alembic -c libs/db/alembic.ini upgrade head && uv run --project apps/backend --no-sync python -m src.http_api_server --host 0.0.0.0 --port 8080",
      ]
    volumes:
      - ./:/workspace
      - backend_venv:/workspace/apps/backend/.venv
      - backend_uv_cache:/root/.cache/uv
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080/api/health'', timeout=2)" || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    image: node:22-alpine
    environment:
      DISCOVERY_API_BASE_URL: http://backend:8080
    command:
      [
        "sh",
        "-c",
        "corepack enable && pnpm install --frozen-lockfile && pnpm --dir apps/frontend dev --hostname 0.0.0.0 --port 3000",
      ]
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  dagit:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    env_file:
      - docker/compose/stack.env
      - docker/compose/local.secrets.env
    environment:
      UV_HTTP_TIMEOUT: "180"
      UV_HTTP_RETRIES: "5"
      LOCAL_DB_HOST: db
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-longtail_local}
      LOCAL_DB_USER: ${LOCAL_DB_USER:-longtail}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-longtail}
      DAGSTER_METADATA_DB_HOST: dagster_db
      DAGSTER_METADATA_DB_PORT: 5432
      DAGSTER_METADATA_DB_NAME: ${DAGSTER_METADATA_DB_NAME:-dagster_local}
      DAGSTER_METADATA_DB_USER: ${DAGSTER_METADATA_DB_USER:-dagster}
      DAGSTER_METADATA_DB_PASSWORD: ${DAGSTER_METADATA_DB_PASSWORD:-longtail}
      DAGSTER_METADATA_ENFORCE: "1"
      DAGSTER_HOME: /workspace/.tmp/dagster-home
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        'mkdir -p "$${DAGSTER_HOME}" && cp apps/pipeline/dagster.yaml "$${DAGSTER_HOME}/dagster.yaml" && if [ ! -x apps/pipeline/.venv/bin/dagster ]; then uv sync --project apps/pipeline --frozen; fi && uv run --project apps/pipeline --no-sync dagster dev -d apps/pipeline -m src.orchestration.definitions --host 0.0.0.0 --port 3000',
      ]
    volumes:
      - ./:/workspace
      - dagit_pipeline_venv:/workspace/apps/pipeline/.venv
      - dagit_uv_cache:/root/.cache/uv
    ports:
      - "${DAGIT_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
      dagster_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import json, urllib.request; payload=json.dumps({''query'':''query LocalWorkspaceCheck { workspaceOrError { __typename ... on Workspace { locationEntries { id } } } }''}).encode(); req=urllib.request.Request(''http://localhost:3000/graphql'', data=payload, headers={''Content-Type'':''application/json''}); data=json.load(urllib.request.urlopen(req, timeout=3)); workspace=data.get(''data'', {}).get(''workspaceOrError'', {}); entries=workspace.get(''locationEntries'', []); raise SystemExit(0 if workspace.get(''__typename'') == ''Workspace'' and len(entries) >= 1 else 1)" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  local_db_data:
  dagster_metadata_db_data:
  frontend_node_modules:
  backend_venv:
  backend_uv_cache:
  dagit_pipeline_venv:
  dagit_uv_cache:
