services:
  db:
    image: postgres:16-alpine
    env_file:
      - docker/compose/stack.env
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-longtail_local}
      POSTGRES_USER: ${LOCAL_DB_USER:-longtail}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-longtail}
    ports:
      - "${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - local_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOCAL_DB_USER:-longtail} -d ${LOCAL_DB_NAME:-longtail_local}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  pipeline:
    image: python:3.12-alpine
    command: ["sh", "-c", "python -m http.server 8090"]
    working_dir: /workspace
    ports:
      - "8090:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8090'', timeout=2)" || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    image: python:3.12-alpine
    command: ["sh", "-c", "python -m http.server 8080"]
    working_dir: /workspace
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080'', timeout=2)" || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    image: node:22-alpine
    command:
      [
        "sh",
        "-c",
        'node -e "require(''http'').createServer((_,res)=>res.end(''ok'')).listen(3000)"',
      ]
    working_dir: /workspace
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  dagit:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    env_file:
      - docker/compose/stack.env
    environment:
      UV_HTTP_TIMEOUT: "180"
      UV_HTTP_RETRIES: "5"
      LOCAL_DB_HOST: db
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-longtail_local}
      LOCAL_DB_USER: ${LOCAL_DB_USER:-longtail}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-longtail}
      DAGSTER_HOME: /workspace/.tmp/dagster-home
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        'mkdir -p "$${DAGSTER_HOME}" && uv sync --project apps/pipeline --frozen && uv run --project apps/pipeline dagster dev -d apps/pipeline -m src.orchestration.definitions --host 0.0.0.0 --port 3000',
      ]
    volumes:
      - ./:/workspace
      - dagit_pipeline_venv:/workspace/apps/pipeline/.venv
      - dagit_uv_cache:/root/.cache/uv
    ports:
      - "${DAGIT_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:3000'', timeout=2)" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  local_db_data:
  dagit_pipeline_venv:
  dagit_uv_cache:
