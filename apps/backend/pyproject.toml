[project]
name = "longtail-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "ruptures>=1.1.0",
    "scipy>=1.13.0",
    "sqlalchemy>=2.0.36",
    "statsmodels>=0.14.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.7.0", "ty>=0.0.1a16"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "D",
    "A",
    "C4",
    "UP",
    "SIM",
    "RET",
    "PTH",
    "DTZ",
    "PL",
]
ignore = ["D212", "D203"]

[tool.pytest.ini_options]
addopts = "-q --maxfail=1 --cov=apps/backend/src --cov-report=term-missing --cov-fail-under=90"
testpaths = ["apps/backend/tests"]

[tool.ty]
python-version = "3.12"
