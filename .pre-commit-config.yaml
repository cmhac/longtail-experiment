repos:
  - repo: local
    hooks:
      - id: frontend-tailwind-upgrade
        name: frontend-tailwind-upgrade
        entry: bash -c "cd apps/frontend && pnpx @tailwindcss/upgrade --force"
        language: system
        files: ^apps/frontend/
        pass_filenames: false
      - id: monorepo-lint-affected
        name: monorepo-lint-affected
        entry: |
          bash -c 'FILES="$(git diff --name-only --cached --diff-filter=ACMR | paste -sd, -)"; if [ -z "$FILES" ]; then echo "No staged files for lint"; exit 0; fi; env NX_NATIVE_COMMAND_RUNNER=false pnpm exec nx affected -t lint --files="$FILES"'
        language: system
        pass_filenames: false
      - id: monorepo-format-affected
        name: monorepo-format-affected
        entry: |
          bash -c 'FILES="$(git diff --name-only --cached --diff-filter=ACMR | paste -sd, -)"; if [ -z "$FILES" ]; then echo "No staged files for format"; exit 0; fi; env NX_NATIVE_COMMAND_RUNNER=false pnpm exec nx affected -t format --files="$FILES"'
        language: system
        pass_filenames: false
      - id: monorepo-typecheck-affected
        name: monorepo-typecheck-affected
        entry: |
          bash -c 'FILES="$(git diff --name-only --cached --diff-filter=ACMR | paste -sd, -)"; if [ -z "$FILES" ]; then echo "No staged files for typecheck"; exit 0; fi; env NX_NATIVE_COMMAND_RUNNER=false pnpm exec nx affected -t typecheck --files="$FILES"'
        language: system
        pass_filenames: false
      - id: monorepo-test-affected
        name: monorepo-test-affected
        entry: |
          bash -c 'FILES="$(git diff --name-only --cached --diff-filter=ACMR | paste -sd, -)"; if [ -z "$FILES" ]; then echo "No staged files for test"; exit 0; fi; env NX_NATIVE_COMMAND_RUNNER=false pnpm exec nx affected -t test --files="$FILES"'
        language: system
        pass_filenames: false
      - id: monorepo-coverage-affected
        name: monorepo-coverage-affected
        entry: |
          bash -c 'FILES="$(git diff --name-only --cached --diff-filter=ACMR | paste -sd, -)"; if [ -z "$FILES" ]; then echo "No staged files for coverage"; exit 0; fi; env NX_NATIVE_COMMAND_RUNNER=false pnpm exec nx affected -t coverage --files="$FILES"'
        language: system
        pass_filenames: false
      - id: duplication-check
        name: duplication-check
        entry: |
          bash -c 'FILES="$(git diff --name-only --cached --diff-filter=ACMR | paste -sd, -)"; if [ -z "$FILES" ]; then echo "No staged files for duplication"; exit 0; fi; env NX_NATIVE_COMMAND_RUNNER=false pnpm exec nx affected -t duplication --files="$FILES"'
        language: system
        pass_filenames: false
      - id: disallow-inline-suppression
        name: disallow-inline-suppression
        entry: |
          bash -c "! rg -n 'noqa|eslint-disable|type: ignore|ruff: noqa|ts-ignore|ts-expect-error' apps/backend/src apps/pipeline/src apps/frontend/src libs tools/provider_bootstrap"
        language: system
        pass_filenames: false
