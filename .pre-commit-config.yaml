repos:
  - repo: local
    hooks:
      - id: monorepo-lint-all
        name: monorepo-lint-all
        entry: pnpm exec nx run-many -t lint --all
        language: system
        pass_filenames: false
      - id: monorepo-format-all
        name: monorepo-format-all
        entry: pnpm exec nx run-many -t format --all
        language: system
        pass_filenames: false
      - id: monorepo-typecheck-all
        name: monorepo-typecheck-all
        entry: pnpm exec nx run-many -t typecheck --all
        language: system
        pass_filenames: false
      - id: monorepo-test-all
        name: monorepo-test-all
        entry: pnpm exec nx run-many -t test --all
        language: system
        pass_filenames: false
      - id: monorepo-coverage-all
        name: monorepo-coverage-all
        entry: pnpm exec nx run-many -t coverage --all
        language: system
        pass_filenames: false
      - id: duplication-check
        name: duplication-check
        entry: bash tools/quality/cpd/run-cpd.sh
        language: system
        pass_filenames: false
      - id: disallow-inline-suppression
        name: disallow-inline-suppression
        entry: |
          bash -c "! rg -n 'noqa|eslint-disable|type: ignore|ruff: noqa|ts-ignore|ts-expect-error' apps tools"
        language: system
        pass_filenames: false
